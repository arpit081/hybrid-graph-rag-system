version: '3'

services:
  knowledge_graph_etl:
    build:
      context: ./knowledge_graph_etl
    env_file:
      - .env

  core_api:
    build:
      context: ./core_api
    env_file:
      - .env
    depends_on:
      - knowledge_graph_etl
      - redis
    ports:
      - "8000:8000"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  web_ui:
    build:
      context: ./web_ui
    env_file:
      - .env
    depends_on:
      - core_api
    ports:
      - "8501:8501"

  admin_query_portal:
    build:
      context: ./admin_query_portal
    env_file:
      - .env
    depends_on:
      - knowledge_graph_etl
    ports:
      - "8502:8502"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
